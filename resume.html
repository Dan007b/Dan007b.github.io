<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Danny Bosak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <h1 class="logo"><a href="index.html">Danny Bosak</a></h1>
    <a href="index.html#about">About</a>
    <a href="index.html#projects">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<div class="resume-info-main">
  <div class="resume-text">
    <p class="last-updated">Resume last uploaded on <strong>Sep 26, 2026</strong></p>
  </div>
  <div class="resume-actions">
    <a class="btn btn-outline" href="Danylo%20Bosak.pdf" target="_blank" rel="noopener">Open PDF</a>
    <a class="download-btn" href="Danylo%20Bosak.pdf" download>Download Resume</a>
  </div>
</div>

<div class="pdf-container">
  <!-- Pages are drawn here by PDF.js so the resume shows on every phone and browser -->
  <div class="pdf-pages" data-pdf="Danylo%20Bosak.pdf" aria-label="Resume">
    <p class="pdf-status">Loading resume…</p>
  </div>
  <a class="back-link" href="index.html"><span aria-hidden="true">&larr;</span> Back to home</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  const box = document.querySelector('.pdf-pages');
  const url = box.dataset.pdf;
  const status = box.querySelector('.pdf-status');

  // If PDF.js can't run (e.g. the page was opened from disk, or the CDN is blocked),
  // fall back to the browser's own PDF viewer so there is still a preview.
  function fail() {
    if (box.querySelector('iframe')) return;
    const frame = document.createElement('iframe');
    frame.className = 'pdf-frame';
    frame.src = url;
    frame.title = 'Resume';
    const note = document.createElement('p');
    note.className = 'pdf-note';
    note.innerHTML = 'Preview not showing? <a href="' + url + '" target="_blank" rel="noopener">Open the PDF</a>.';
    box.replaceChildren(frame, note);
  }

  if (!window.pdfjsLib) { fail(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdf = null;

  async function render() {
    const width = box.clientWidth;
    const ratio = Math.min(window.devicePixelRatio || 1, 3);
    const canvases = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: (width / base.width) * ratio });
      const canvas = document.createElement('canvas');
      canvas.className = 'pdf-page';
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.setAttribute('aria-label', 'Resume page ' + n);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      canvases.push(canvas);
    }
    box.replaceChildren(...canvases);
  }

  pdfjsLib.getDocument(url).promise
    .then(doc => { pdf = doc; return render(); })
    .catch(fail);

  // re-draw sharply after rotating the phone or resizing the window
  let lastWidth = box.clientWidth, timer = null;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (pdf && Math.abs(box.clientWidth - lastWidth) > 40) {
        lastWidth = box.clientWidth;
        render().catch(fail);
      }
    }, 250);
  });
})();
</script>
</body>
</html>
